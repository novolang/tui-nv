[package]
name        = "tui-nv"
version     = "0.1.0"
description = "Layout, widgets and the damage model for a terminal user interface, with the writer belonging to the caller: a constraint solver over rectangles, a cell buffer, a diff of two buffers into the smallest set of changes, and the widgets a real program needs — block, paragraph, list, table, gauge, tabs, scrollbar.  Nothing here writes to a terminal."
license     = "Apache-2.0"

# `experimental` because no program outside this package has drawn a
# frame with it yet, and the tests were written against the signatures
# rather than by a consumer.
stability   = "experimental"

# `core`.  A widget renders into a buffer, the buffer diffs against the
# last one, and the diff becomes bytes in a list the caller owns and
# writes — so the whole of the drawing is a pure function and the one
# effect in the loop is the caller's single write.  That is also what
# makes a frame testable: render it, diff it, and assert on the bytes,
# with no terminal anywhere.
layer       = "core"

category    = "terminal"

tags        = ["tui", "terminal", "widgets", "layout", "ratatui", "damage", "diff", "cell-buffer", "sans-io"]
repository  = "https://github.com/novolang/tui-nv"
maintainers = ["novo-lang"]
# Built, tested and measured on 0.9.1.  The floor is the toolchain the
# release was checked against rather than the oldest one that might
# work.
novo        = ">= 0.9.1"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Layout, widgets and the damage model"

[dependencies]
# ansi-nv, for the style model and the writer.  A `TuiCell` carries an
# `SgrAttrs`, so the style a diff hands to `seqwrite.sgr_change` needs
# no conversion, and a second colour model here would mean translating
# every changed cell at the boundary, in the one loop where the cost is
# per cell.  It performs no input or output, so it sits under a `core`
# package.
ansi-nv = "^0.1.0"

# textwrap-nv, for the paragraph widget.  Wrapping at a display width
# is the whole of what a paragraph does that a `buffer_set_str` does
# not, and `wrapped_height` is what a layout asks before it decides how
# tall to make one.  It performs no input or output, so it sits under a
# `core` package.
textwrap-nv = "^0.1.0"
